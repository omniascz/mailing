services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgemsg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: forgemsg
      POSTGRES_USER: forgemsg
      POSTGRES_PASSWORD: forgemsg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgemsg -d forgemsg"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgemsg-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: forgemsg-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9100:9000"   # Native (remapped to avoid MinIO conflict)
    environment:
      CLICKHOUSE_DB: forgemsg
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: forgemsg-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: forgemsg-dev-cluster-001
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    # Our own copy of the S3 server, for the reason this line has been edited
    # twice in a fortnight: Docker Hub deleted `minio/minio` on 2026-09-12 and
    # quay.io/minio/minio went private for every tag on 09-24, the pinned digest
    # included, so `docker compose up` simply stopped working here. The image is
    # MinIO built by Chainguard, copied digest-for-digest into a registry we own
    # by .github/workflows/mirror-ci-images.yml; the candidate measurements that
    # chose it are in .github/workflows/ci.yml, which runs the same digest with
    # the same arguments. The package is public, so this pulls anonymously - no
    # `docker login ghcr.io` needed on a dev machine.
    #
    # `user: "0:0"` is required: the entrypoint is /usr/bin/minio as uid 65532,
    # which cannot write the minio_data volume, and `server /data` then dies
    # with "Unable to initialize backend: file access denied".
    image: ghcr.io/omniascz/ci-s3:minio-2026-09-25@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: forgemsg-minio
    user: "0:0"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  kafka_data:
  minio_data:
