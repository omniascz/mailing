name: CD

# Manual-only, deliberately. The push trigger (branches: [master] + tags: v*)
# was removed after it fired for the first time on the PR #1 merge and failed
# on every push, which is noise that trains people to ignore a red CD.
#
# Two things must be fixed before the push trigger comes back:
#
#   (a) await-ci races CI on the same push. Both workflows start from the same
#       event, and `CI Pass` is the LAST job in CI — so the check does not
#       exist yet when wait-on-check-action looks for it, and the action fails
#       rather than waiting. It needs `running-workflow-name` (or an equivalent
#       "wait for the check to appear" setting) before it can gate a push.
#       Observed: run 30886102955, Await CI exit 1 after ~14s.
#
#   (b) The build matrix still publishes sms-gateway, and we have not decided
#       whether that service ships. Turning the trigger on would start pushing
#       images for it to GHCR on every merge.
#
# The await-ci gate itself is correct and stays as is — `build-push` runs only
# on `needs.await-ci.result == 'success'`, so a red or missing CI cannot
# publish. Do not weaken it when re-enabling the trigger.
on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to build (api,workers,voice-bot,engine,sms-gateway). Empty = all.'
        required: false
        default: ''

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # don't cancel a half-pushed image set

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # Wait for CI to pass on the same SHA before publishing.
  #
  # This job used to carry `if: github.event_name == 'push'`, which meant a
  # workflow_dispatch run skipped it entirely — and because build-push accepted
  # `needs.await-ci.result == 'skipped'`, anyone able to press "Run workflow"
  # could publish images from a SHA whose CI was red or had never run. The gate
  # now applies to every trigger.
  await-ci:
    name: Await CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI workflow on this SHA
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'CI Pass'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  build-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [await-ci]
    # Only a genuinely green CI on this SHA publishes. 'skipped' is no longer
    # accepted — that was the bypass.
    if: ${{ needs.await-ci.result == 'success' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: workers
            context: .
            dockerfile: apps/workers/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: voice-bot
            context: .
            dockerfile: apps/voice-bot/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: engine
            context: apps/engine
            dockerfile: apps/engine/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: sms-gateway
            context: apps/sms-gateway
            dockerfile: apps/sms-gateway/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/forgemsg-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Skip if requested service filter excludes this one
        id: filter
        run: |
          requested='${{ github.event.inputs.services }}'
          if [ -n "$requested" ]; then
            case ",$requested," in
              *,${{ matrix.service }},*) echo "build=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "build=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push ${{ matrix.service }}
        if: steps.filter.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

  release-summary:
    name: Release summary
    runs-on: ubuntu-latest
    needs: [build-push]
    if: always()
    steps:
      - name: Summarise published images
        run: |
          echo "## Pushed images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for s in api workers voice-bot engine sms-gateway; do
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/forgemsg-$s:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          done
