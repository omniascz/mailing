name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to build (api,workers,voice-bot,engine,sms-gateway). Empty = all.'
        required: false
        default: ''

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # don't cancel a half-pushed image set

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # Wait for CI to pass on the same SHA before publishing.
  await-ci:
    name: Await CI
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI workflow on this SHA
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'CI Pass'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  build-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [await-ci]
    if: ${{ always() && (needs.await-ci.result == 'success' || needs.await-ci.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: workers
            context: .
            dockerfile: apps/workers/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: voice-bot
            context: .
            dockerfile: apps/voice-bot/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: engine
            context: apps/engine
            dockerfile: apps/engine/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: sms-gateway
            context: apps/sms-gateway
            dockerfile: apps/sms-gateway/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/forgemsg-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Skip if requested service filter excludes this one
        id: filter
        run: |
          requested='${{ github.event.inputs.services }}'
          if [ -n "$requested" ]; then
            case ",$requested," in
              *,${{ matrix.service }},*) echo "build=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "build=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push ${{ matrix.service }}
        if: steps.filter.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

  release-summary:
    name: Release summary
    runs-on: ubuntu-latest
    needs: [build-push]
    if: always()
    steps:
      - name: Summarise published images
        run: |
          echo "## Pushed images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for s in api workers voice-bot engine sms-gateway; do
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/forgemsg-$s:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          done
