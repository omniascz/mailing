name: CI

on:
  push:
    # master, not main — this repo's default branch is master, so the push
    # trigger pointed at a branch that does not exist and CI never ran on a
    # merge. Only the pull_request trigger was firing.
    branches: [master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both checks run even if the earlier one fails, so a single CI run
      # reports the full set of violations instead of stopping at the first.
      - run: pnpm format:check
        if: always()
      - run: pnpm lint
        if: always()

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        # pgvector, not plain postgres:16-alpine — the baseline migration opens
        # with `CREATE EXTENSION IF NOT EXISTS vector;` and alpine answers
        # `ERROR: extension "vector" is not available` (the control file is not
        # on the image at all, so IF NOT EXISTS does not save it).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_test
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite currently passes with no database at all (postgres-js connects
      # lazily and nothing queries), so this does not change any result today.
      # It exists so the Postgres service is actually schema-backed and the
      # first test that does hit the DB gets a real one instead of an empty one.
      - name: Apply migrations
        run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm test

  integration:
    name: Integration (real DB)
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_itest
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Uploads go here. The bucket and its public-read policy are created by
      # the suite itself, so a bare `server /data` is enough. Public
      # read is the property under test: a mail client fetches with no session.
      #
      # ONE block, and it has to stay one. These five keys were declared TWICE in
      # this same `env:` mapping, with two different bucket names. A parser that
      # tolerates duplicate keys takes the last one silently; GitHub rejects the
      # whole file, and then ci.yml is not a workflow at all - no PR gets checks
      # and nothing says why. That is what happened, and it is why the names are
      # reconciled here rather than appended below.
      #
      # One bucket serves both suites: archive-roundtrip and media-upload each
      # create it if missing and tolerate "already exists", and both read this
      # variable, so they cannot disagree about the name.
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: forgemsg
      # 127.0.0.1, not localhost: postgres-js in the app's connection pool
      # resolves `localhost` to ::1 on some hosts and then times out against a
      # service published on IPv4. Reproduced locally as
      # `write CONNECT_TIMEOUT localhost:55433`.
      DATABASE_URL: postgresql://forgemsg:forgemsg@127.0.0.1:5432/forgemsg_itest
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: integration-only-secret-not-for-production-1234567890
      # Required by config/env.ts in every environment. The jobs below boot the
      # real API (pnpm --filter @forgemsg/api start), which is not a vitest
      # process, so it does not get the test defaults and refuses to start
      # without a sender. That refusal is the point of the check.
      SYSTEM_EMAIL_FROM: no-reply@ci.invalid
      SYSTEM_EMAIL_FROM_NAME: ForgeMsg CI
      # The suite drives /api/v1/internal/* through the real internal-auth hook,
      # which compares against this. Without it every such call is answered 401
      # and 12 cases fail — not on the behaviour they test, but on the header.
      # workers-integration has always set it; this job was simply missed.
      INTERNAL_API_SECRET: integration-only-internal-secret-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @forgemsg/shared "exports" point at ./dist, and the integration suite
      # imports it (services/auth/sessions.ts -> @forgemsg/shared/redis), so the
      # package has to be built first. Without this the run dies with
      # `Cannot find package '@forgemsg/shared/redis'`.
      - run: pnpm turbo build --filter=@forgemsg/shared
      # A step rather than a service container: the official image needs
      # `server /data` as its command, and service containers cannot pass one.
      # bitnami/minio, which can run without arguments, no longer publishes a
      # public `latest`.
      #
      # The archive writes email_events to object storage and then deletes them
      # from Postgres, so without a store here that path could only be covered
      # by not covering it — which is how it shipped an unsigned PUT whose
      # response nobody read.
      #
      # ONE MinIO, and it has to stay one. This step existed twice, under two
      # container names, both binding 9000 - steps are a list, so nothing warns
      # you; the second just dies with "port is already allocated" and takes the
      # job with it. It was invisible because the duplicate env keys had already
      # made the whole workflow unparseable, so this job had not run at all.
      #
      # A step and not a service container: a service cannot pass a command, and
      # the image needs `server /data`. The media upload suite writes real
      # bytes and reads them back over plain HTTP the way a mail client does, so
      # mocking the store would leave the one thing that path exists for
      # untested. Bucket and public-read policy are created by the suites.
      #
      # Three registries in two weeks. Docker Hub's `minio/minio` namespace was
      # deleted on 12 Sep 2026, quay.io/minio/minio went private for every tag
      # on 24 Sep - including the digest that was pinned right here, which is
      # the point: the pull died with `docker: unauthorized`, exit 125, before a
      # single test ran, and every later check then reads as skipped. What broke
      # was not the tag. It was the right to pull at all, so pinning harder
      # cannot fix it. ghcr.io/minio/minio refuses too.
      #
      # Six candidates were pulled, started, and measured against the ten things
      # the suites actually ask of the store - CreateBucket, PutBucketPolicy,
      # Put/Get, NoSuchKey on a missing key, presigned GET and presigned PUT,
      # anonymous read of a public object, ListObjectsV2, Delete:
      #   quay.io/minio/aistor/minio pulls, then denies every S3 call with "No
      #     valid license found, running in offline mode" - 0 of 10.
      #   adobe/s3mock:3.12.0 does 9, has no bucket policy, and verifies no
      #     credentials at all - which would let the signing suites pass while
      #     signing was broken. A store that accepts anything cannot fail.
      #   chrislusf/seaweedfs:3.80 does 9; PutBucketPolicy is NotImplemented in
      #     every policy shape, and unconfigured it also checks no credentials.
      #   dxflrs/garage:v1.0.1 does 7 - no policy, presigned PUT answers 400.
      #   zenko/cloudserver does all 10 once the policy says Principal "*"
      #     instead of {"AWS":["*"]}, and it does enforce signatures, but it is
      #     2.05 GB per job and its last push was 2023-01-10.
      #   cgr.dev/chainguard/minio does all 10 at 243 MB - with --user 0:0.
      #
      # Hence --user 0:0, which is the "file access denied" this comment used to
      # reject the image for: the entrypoint is /usr/bin/minio as uid 65532 and
      # `server /data` cannot write the volume. Root inside a container that is
      # deleted with the runner is the entire price, and it buys a store that
      # needs no change to any test.
      #
      # Honest limits. This is still MinIO, i.e. still the upstream that moved
      # three times, and cgr.dev serves only `latest` anonymously: tags/list
      # answers 401 even with a valid pull token, so nothing here can watch the
      # tag move or tell how long this digest stays fetchable. Tag AND digest,
      # so a moved tag cannot silently change what runs; if the digest is
      # collected this fails at pull time, loudly, the way it just did. The only
      # source that cannot be taken away is one we own - mirror this digest into
      # ghcr.io/omniascz and pull from there. That needs a token with
      # write:packages, which this branch does not have.
      - name: Start MinIO
        run: |
          docker run -d --name ci-minio -p 9000:9000 --user 0:0 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then echo "minio up"; exit 0; fi
            sleep 2
          done
          echo "minio did not become healthy"; docker logs ci-minio; exit 1
      - run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm seed
      - run: pnpm --filter @forgemsg/api test:integration

  workers-integration:
    name: Workers Integration (real DB + API)
    runs-on: ubuntu-latest
    needs: [typecheck]
    # In the CI Pass needs list since 85b1d16 (2026-08-07). This comment used
    # to say the opposite — that the job was deliberately left out until it
    # earned a track record — and it stayed there for three and a half weeks
    # after the code stopped agreeing with it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_witest
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@127.0.0.1:5432/forgemsg_witest
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: workers-integration-secret-not-for-production-123456
      # Required by config/env.ts in every environment. The jobs below boot the
      # real API (pnpm --filter @forgemsg/api start), which is not a vitest
      # process, so it does not get the test defaults and refuses to start
      # without a sender. That refusal is the point of the check.
      SYSTEM_EMAIL_FROM: no-reply@ci.invalid
      SYSTEM_EMAIL_FROM_NAME: ForgeMsg CI
      INTERNAL_API_SECRET: workers-integration-internal-secret-32-chars-min
      API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@forgemsg/api
      - run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm seed
      - name: Start API in background
        run: |
          nohup pnpm --filter @forgemsg/api start > /tmp/wapi.log 2>&1 &
          sleep 5
          # --retry-connrefused for the same reason as the E2E job: plain
          # --retry does not retry a refused connection.
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/health || {
            echo "::group::/tmp/wapi.log"; cat /tmp/wapi.log; echo "::endgroup::"; exit 1;
          }
      - run: pnpm --filter @forgemsg/workers test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # Non-blocking — surfaces new high+critical CVEs as a warning so we
    # can patch quickly without blocking unrelated PRs. Promote to a
    # required check once we've stabilised the baseline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  build-go:
    name: Build Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [engine, sms-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/${{ matrix.service }}/go.sum
      - name: Build ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go build -o /dev/null .
      - name: Vet ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go vet ./...
      - name: Test ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go test ./...

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck]
    # Runs on every PR. It used to be label-gated ("the dev stack is
    # heavyweight and the suite is opt-in"), and the label was applied exactly
    # once, to PR #1, on 2026-08-02. Twenty-one consecutive PRs since then
    # reported `skipping`, so the only browser-level check this repo has
    # verified nothing for four weeks while sitting on the PR page looking
    # like part of CI.
    #
    # The gate is off because the premise behind it did not survive
    # measurement. The three runs this job has ever had all passed and all
    # took about the same time:
    #
    #   PR #1              2026-08-02   3m57s   pass
    #   workflow_dispatch  2026-08-04   3m41s   pass
    #   workflow_dispatch  2026-08-04   3m38s   pass
    #
    # against a critical path of 3m54s (Integration (real DB)). The suite is
    # not heavier than what the pipeline already waits for — it is the same
    # length — so gating it bought no wall-clock time at all.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_e2e
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-only-secret-not-for-production-use-1234567890
      # Required by config/env.ts in every environment. The jobs below boot the
      # real API (pnpm --filter @forgemsg/api start), which is not a vitest
      # process, so it does not get the test defaults and refuses to start
      # without a sender. That refusal is the point of the check.
      SYSTEM_EMAIL_FROM: no-reply@ci.invalid
      SYSTEM_EMAIL_FROM_NAME: ForgeMsg CI
      # localhost, not 127.0.0.1: the session cookie the API sets is host-only,
      # so a cookie issued by 127.0.0.1:3001 is never sent to localhost:3000 and
      # apps/web's middleware bounces every logged-in user back to /login.
      # Both origins must agree on the hostname.
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm seed
      - name: Build + start API in background
        run: |
          # `pnpm --filter <pkg> build` runs the package script directly and
          # bypasses turbo, so turbo.json `build.dependsOn: ["^build"]` never
          # applies and packages/shared/dist is never produced. That is why
          # this step failed with 144 TS2307 "Cannot find module
          # '@forgemsg/shared'" the first time the job ever ran.
          pnpm turbo build --filter=@forgemsg/api
          nohup pnpm --filter @forgemsg/api start > /tmp/api.log 2>&1 &
          sleep 5
          # --retry-connrefused is load-bearing, not decoration: plain --retry
          # only retries *transient* errors (timeouts, 5xx, 429). A refused
          # connection — exactly what a not-yet-listening API returns — is not
          # in that set, so without this flag curl bails on the first attempt
          # with exit 7 and the 10 retries never run at all.
          #
          # --retry 30 (not 10) buys headroom the old budget did not have.
          # Measured cold start of this same command
          # (`pnpm --filter @forgemsg/api start`, tsx dist/index.js):
          #   - dev box (Windows): 13.6 / 14.5 / 16.0 s over three runs
          #   - this runner (ubuntu-latest): under 5 s — the first curl after
          #     the sleep succeeded, so the retries were never entered
          # The runner is the faster of the two, so 5 + 10x2 = 25 s was not
          # what broke the step; the missing --retry-connrefused was. 30
          # retries (ceiling 5 + 30x2 = 65 s) cover a cold or loaded runner
          # at ~4x the slowest start we have measured anywhere, and cost
          # nothing when the API is already up — curl stops at first success.
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3001/health || {
            echo "::group::/tmp/api.log"; cat /tmp/api.log; echo "::endgroup::"; exit 1;
          }
      - name: Build + start web in background
        run: |
          pnpm turbo build --filter=@forgemsg/web
          nohup pnpm --filter @forgemsg/web start > /tmp/web.log 2>&1 &
          sleep 5
          # Same reasoning as the API step above: without --retry-connrefused
          # the retries are dead code for the one failure they exist to cover.
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3000/landing || {
            echo "::group::/tmp/web.log"; cat /tmp/web.log; echo "::endgroup::"; exit 1;
          }
      - name: Install Playwright browsers
        run: pnpm --filter @forgemsg/web exec playwright install --with-deps chromium
      - name: Run smoke
        run: pnpm --filter @forgemsg/web test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # ── DB migrations ──────────────────────────────────────────────────────────
  #
  # These two lived in db-migrations.yml, triggered by `on: pull_request:
  # paths:`. That put them out of reach of `ci-pass`, whose `needs` cannot name
  # a job in another workflow, and branch protection requires only `CI Pass` —
  # so a PR with a broken migration merged with a green merge button and
  # nothing said otherwise.
  #
  # Making them required where they were is not possible. GitHub's own
  # troubleshooting page is explicit: a workflow skipped by a paths filter
  # leaves its check "Pending" and blocks merging forever, so adding those two
  # names to required_status_checks would hang every PR that does not touch
  # migrations. (A job skipped by an `if:` reports Success instead — which is
  # the opposite failure: it satisfies the requirement without running.)
  #
  # So they move here and run unconditionally. No paths filter, no `if:`, and
  # `ci-pass` can keep treating `skipped` as a failure for every job it names.
  # The cost is measured, not guessed: 21-26 s for the drift check and 36-41 s
  # for the dry run, against a critical path of 3m49s (Integration). They are
  # not on it, so the pipeline does not get slower.

  drift-check:
    name: Schema ↔ migrations drift
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The drift check below can only see what the barrel exports, because
      # drizzle.config.ts names db/schema/index.ts as the schema entry. A table
      # whose module is missing from that file produces no diff and this job
      # passes — which is exactly how data_sets, permission_sets and
      # user_permission_sets went unmigrated while a live route queried them.
      # So verify the barrel first; otherwise "no drift" is only true of the
      # tables drizzle-kit happens to be able to see.
      - name: Every pgTable is re-exported from the schema barrel
        working-directory: apps/api
        run: pnpm exec vitest run src/db/schema-barrel.test.ts

      # drizzle-kit exits 0 even when it refuses to do any work. A snapshot
      # chain with two children of one parent makes it print
      #
      #   Error: [0018_snapshot.json, 0019_snapshot.json] are pointing to a
      #   parent snapshot: … which is a collision.
      #
      # and return success, having generated nothing. The next step then finds
      # drizzle/ unchanged and reports "no drift" — so a generate that cannot
      # run at all ships as a green check. That is not hypothetical: PR #88
      # would have done exactly this.
      #
      # There is no exit code to read here, and no artefact either, because the
      # failure mode IS "produced nothing". The printed message is the only
      # signal drizzle-kit gives, so the message is what this checks. Table
      # names are lower snake_case, so an anchored `^Error` cannot collide with
      # the tool's normal per-table output.
      - name: Generate migrations from current schema (dry)
        working-directory: apps/api
        run: |
          set -o pipefail
          pnpm db:generate 2>&1 | tee "$RUNNER_TEMP/generate.log"
          if grep -q '^Error' "$RUNNER_TEMP/generate.log"; then
            echo "::error::drizzle-kit did not complete — it printed an Error and exited 0. See the log above."
            exit 1
          fi

      - name: Verify no uncommitted SQL was produced
        working-directory: apps/api
        run: |
          # If `db:generate` writes a new SQL file or modifies the journal,
          # the schema is ahead of the committed migrations. Block the PR.
          if ! git diff --quiet --exit-code drizzle/; then
            echo "::error::drizzle/ has uncommitted changes — schema and migrations are out of sync."
            echo "Run \`pnpm db:generate\` locally and commit the result."
            git status drizzle/
            git diff drizzle/
            exit 1
          fi

  apply-dry-run:
    name: Apply migrations (dry run)
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_test
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations against ephemeral Postgres
        working-directory: apps/api
        run: pnpm db:migrate

      - name: Verify schema query reachability
        run: |
          # A trivial query against information_schema confirms migrations took.
          PGPASSWORD=forgemsg psql -h localhost -U forgemsg -d forgemsg_test \
            -c "select count(*) from information_schema.tables where table_schema='public';"

  # The same class of silent drift, one directory over.
  #
  # apps/engine/proto/mta.pb.go is committed, carries a DO NOT EDIT header, and
  # is produced by running protoc by hand. Nothing checked that it still matched
  # mta.proto, so a change to the source without a regeneration would have left
  # the committed Go describing one contract while the source described another.
  #
  # That failure is silent rather than loud, and worse than it sounds, because
  # the two sides of this wire do not read the same artefact. The Go engine is
  # compiled from the generated file; apps/workers loads mta.proto ITSELF at
  # runtime through @grpc/proto-loader. So a proto change without a regeneration
  # means TypeScript speaks the new contract and Go the old one — and proto3
  # ignores fields it does not know, so nothing raises. A field the worker sets
  # is simply never seen, and a field it reads is simply never sent.
  #
  # DETERMINISM, measured rather than assumed: with the three versions below,
  # regenerating on top of the committed output produces a byte-identical file —
  # verified on both mta.pb.go and mta_grpc.pb.go. The only part that is not
  # source-derived is the generator banner, which names the exact versions:
  #
  #     // 	protoc-gen-go v1.36.11
  #     // 	protoc        v7.34.1
  #
  # So a different generator changes the file without the contract changing, and
  # a check that did not pin versions would go red on a protoc bump and teach
  # everyone to ignore it. Pinning is what makes this reproducible; it is not
  # tidiness. When a version is deliberately raised, this is the file to raise
  # it in, and the regenerated output is committed in the same change.
  #
  # No paths filter and no `if:`, for the reason the block above this one gives:
  # a workflow skipped by a paths filter stays Pending and blocks the merge for
  # ever, and a job skipped by `if:` reports Success and enforces nothing. It
  # runs on every PR, including the ones that do not touch proto at all — which
  # is the only way to know it runs.
  proto-drift:
    name: Proto ↔ generated Go drift
    runs-on: ubuntu-latest
    needs: [typecheck]
    env:
      # Bumping any of these three changes the generated output. Change them
      # here and commit the regenerated files in the same PR.
      PROTOC_VERSION: '34.1'
      PROTOC_GEN_GO_VERSION: 'v1.36.11'
      PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/engine/go.sum

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "$url"
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install the code generators
        run: |
          set -euo pipefail
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Printed, not assumed. When this job goes red on a version the banner
      # disagrees with, these three lines are what says so without a re-run.
      - name: Report the versions in use
        run: |
          protoc --version
          protoc-gen-go --version
          protoc-gen-go-grpc --version

      - name: Regenerate from mta.proto
        working-directory: apps/engine
        run: |
          set -euo pipefail
          protoc             --go_out=. --go_opt=paths=source_relative             --go-grpc_out=. --go-grpc_opt=paths=source_relative             proto/mta.proto

      - name: Verify the committed Go matches the proto
        working-directory: apps/engine
        run: |
          if ! git diff --quiet --exit-code proto/; then
            echo "::error::apps/engine/proto is out of sync — mta.proto was changed without regenerating the Go."
            echo "The committed .pb.go describes a different contract from the .proto that apps/workers loads at runtime."
            echo "Regenerate and commit:"
            echo "  cd apps/engine && protoc --go_out=. --go_opt=paths=source_relative \\"
            echo "    --go-grpc_out=. --go-grpc_opt=paths=source_relative proto/mta.proto"
            echo "Using protoc ${PROTOC_VERSION}, protoc-gen-go ${PROTOC_GEN_GO_VERSION}, protoc-gen-go-grpc ${PROTOC_GEN_GO_GRPC_VERSION}."
            git status proto/
            git diff proto/
            exit 1
          fi

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    # Every job that can fail on the code: both integration suites, both
    # DB-migration checks, and the browser smoke.
    #
    # They were left out with a note saying one new test should not gate the
    # pipeline "until it has a track record". They have one now — 9 files
    # between them — and leaving them out had a cost: a red integration suite
    # still produced a green CI Pass, so a PR could merge with it broken and
    # nothing on the PR page said otherwise. That is how the missing
    # INTERNAL_API_SECRET above reached master in the first place.
    #
    # The list below is the ONLY list. The step reads it back through
    # `toJSON(needs)` rather than repeating it, so the two cannot disagree.
    needs:
      [
        lint,
        typecheck,
        test,
        build,
        build-go,
        integration,
        workers-integration,
        drift-check,
        apply-dry-run,
        proto-drift,
        e2e,
      ]
    if: always()
    steps:
      # ONE LIST, not two.
      #
      # This used to name every job twice: once in `needs`, and again in an env
      # block and a `for job in …` loop that read it back. Nothing checked the
      # two agreed, so adding a job to `needs` and forgetting the loop produced
      # a job that gates nothing — it could be red while this stayed green. That
      # is not hypothetical here: workers-integration sat outside `needs` for
      # three and a half weeks under a comment claiming otherwise, and #18
      # merged with the integration suite broken.
      #
      # `toJSON(needs)` serialises the whole context, which is an object keyed
      # by job id with a `result` on each — so the list of jobs to check IS the
      # list of dependencies, read at run time. A job added to `needs` is
      # checked from that moment, and there is no second place to forget.
      #
      # A matrix job is ONE entry: `needs` is keyed by job id, and build-go's
      # two legs produce one id whose result is success only if both legs
      # succeeded. The dump below prints what was actually read, so that is
      # visible rather than assumed.
      #
      # `audit` and `e2e`: audit is continue-on-error, so it reports success
      # whatever `pnpm audit` returns and requiring it would assert nothing.
      # e2e IS required and is in `needs` — it lost its `if:` first, because a
      # label-gated job reports `skipped` and this step treats that as failure.
      - name: Verify every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          # An empty or unreadable context would make the check below pass
          # vacuously — nothing failed because nothing was looked at. That is
          # the same shape as a scan test that finds nothing because it reads
          # nothing, so the count is asserted before the results are.
          count=$(echo "$NEEDS" | jq -r 'length')
          if [ "$count" -lt 10 ]; then
            echo "::error::CI Pass read only $count dependencies. It gates every job in its own needs list, and that list is far shorter than expected — the context is empty or malformed."
            exit 1
          fi

          # `skipped` and `cancelled` are failures, not exemptions: a required
          # job that did not run is a required job that did not pass.
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(" ")')
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed: $failed"
            exit 1
          fi

          echo "All $count required jobs succeeded."
