name: CI

on:
  push:
    # master, not main — this repo's default branch is master, so the push
    # trigger pointed at a branch that does not exist and CI never ran on a
    # merge. Only the pull_request trigger was firing.
    branches: [master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both checks run even if the earlier one fails, so a single CI run
      # reports the full set of violations instead of stopping at the first.
      - run: pnpm format:check
        if: always()
      - run: pnpm lint
        if: always()

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        # pgvector, not plain postgres:16-alpine — the baseline migration opens
        # with `CREATE EXTENSION IF NOT EXISTS vector;` and alpine answers
        # `ERROR: extension "vector" is not available` (the control file is not
        # on the image at all, so IF NOT EXISTS does not save it).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_test
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite currently passes with no database at all (postgres-js connects
      # lazily and nothing queries), so this does not change any result today.
      # It exists so the Postgres service is actually schema-backed and the
      # first test that does hit the DB gets a real one instead of an empty one.
      - name: Apply migrations
        run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm test

  integration:
    name: Integration (real DB)
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_itest
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Uploads go here. The bucket and its public-read policy are created by
      # the suite itself, so a bare `minio/minio server /data` is enough. Public
      # read is the property under test: a mail client fetches with no session.
      #
      # ONE block, and it has to stay one. These five keys were declared TWICE in
      # this same `env:` mapping, with two different bucket names. A parser that
      # tolerates duplicate keys takes the last one silently; GitHub rejects the
      # whole file, and then ci.yml is not a workflow at all - no PR gets checks
      # and nothing says why. That is what happened, and it is why the names are
      # reconciled here rather than appended below.
      #
      # One bucket serves both suites: archive-roundtrip and media-upload each
      # create it if missing and tolerate "already exists", and both read this
      # variable, so they cannot disagree about the name.
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: forgemsg
      # 127.0.0.1, not localhost: postgres-js in the app's connection pool
      # resolves `localhost` to ::1 on some hosts and then times out against a
      # service published on IPv4. Reproduced locally as
      # `write CONNECT_TIMEOUT localhost:55433`.
      DATABASE_URL: postgresql://forgemsg:forgemsg@127.0.0.1:5432/forgemsg_itest
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: integration-only-secret-not-for-production-1234567890
      # Required by config/env.ts in every environment. The jobs below boot the
      # real API (pnpm --filter @forgemsg/api start), which is not a vitest
      # process, so it does not get the test defaults and refuses to start
      # without a sender. That refusal is the point of the check.
      SYSTEM_EMAIL_FROM: no-reply@ci.invalid
      SYSTEM_EMAIL_FROM_NAME: ForgeMsg CI
      # The suite drives /api/v1/internal/* through the real internal-auth hook,
      # which compares against this. Without it every such call is answered 401
      # and 12 cases fail — not on the behaviour they test, but on the header.
      # workers-integration has always set it; this job was simply missed.
      INTERNAL_API_SECRET: integration-only-internal-secret-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @forgemsg/shared "exports" point at ./dist, and the integration suite
      # imports it (services/auth/sessions.ts -> @forgemsg/shared/redis), so the
      # package has to be built first. Without this the run dies with
      # `Cannot find package '@forgemsg/shared/redis'`.
      - run: pnpm turbo build --filter=@forgemsg/shared
      # A step rather than a service container: the official image needs
      # `server /data` as its command, and service containers cannot pass one.
      # bitnami/minio, which can run without arguments, no longer publishes a
      # public `latest`.
      #
      # The archive writes email_events to object storage and then deletes them
      # from Postgres, so without a store here that path could only be covered
      # by not covering it — which is how it shipped an unsigned PUT whose
      # response nobody read.
      #
      # ONE MinIO, and it has to stay one. This step existed twice, under two
      # container names, both binding 9000 - steps are a list, so nothing warns
      # you; the second just dies with "port is already allocated" and takes the
      # job with it. It was invisible because the duplicate env keys had already
      # made the whole workflow unparseable, so this job had not run at all.
      #
      # A step and not a service container: a service cannot pass a command, and
      # minio/minio needs `server /data`. The media upload suite writes real
      # bytes and reads them back over plain HTTP the way a mail client does, so
      # mocking the store would leave the one thing that path exists for
      # untested. Bucket and public-read policy are created by the suites.
      - name: Start MinIO
        run: |
          docker run -d --name ci-minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then echo "minio up"; exit 0; fi
            sleep 2
          done
          echo "minio did not become healthy"; docker logs ci-minio; exit 1
      - run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm seed
      - run: pnpm --filter @forgemsg/api test:integration

  workers-integration:
    name: Workers Integration (real DB + API)
    runs-on: ubuntu-latest
    needs: [typecheck]
    # In the CI Pass needs list since 85b1d16 (2026-08-07). This comment used
    # to say the opposite — that the job was deliberately left out until it
    # earned a track record — and it stayed there for three and a half weeks
    # after the code stopped agreeing with it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_witest
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@127.0.0.1:5432/forgemsg_witest
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: workers-integration-secret-not-for-production-123456
      # Required by config/env.ts in every environment. The jobs below boot the
      # real API (pnpm --filter @forgemsg/api start), which is not a vitest
      # process, so it does not get the test defaults and refuses to start
      # without a sender. That refusal is the point of the check.
      SYSTEM_EMAIL_FROM: no-reply@ci.invalid
      SYSTEM_EMAIL_FROM_NAME: ForgeMsg CI
      INTERNAL_API_SECRET: workers-integration-internal-secret-32-chars-min
      API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@forgemsg/api
      - run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm seed
      - name: Start API in background
        run: |
          nohup pnpm --filter @forgemsg/api start > /tmp/wapi.log 2>&1 &
          sleep 5
          # --retry-connrefused for the same reason as the E2E job: plain
          # --retry does not retry a refused connection.
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/health || {
            echo "::group::/tmp/wapi.log"; cat /tmp/wapi.log; echo "::endgroup::"; exit 1;
          }
      - run: pnpm --filter @forgemsg/workers test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # Non-blocking — surfaces new high+critical CVEs as a warning so we
    # can patch quickly without blocking unrelated PRs. Promote to a
    # required check once we've stabilised the baseline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  build-go:
    name: Build Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [engine, sms-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/${{ matrix.service }}/go.sum
      - name: Build ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go build -o /dev/null .
      - name: Vet ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go vet ./...
      - name: Test ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go test ./...

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck]
    # Skip by default — the dev stack is heavyweight and the suite is
    # opt-in. Trigger by labeling a PR with `run-e2e` or running the
    # workflow manually. When we have a staging deploy we can run it
    # post-merge against staging instead.
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e') || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_e2e
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-only-secret-not-for-production-use-1234567890
      # Required by config/env.ts in every environment. The jobs below boot the
      # real API (pnpm --filter @forgemsg/api start), which is not a vitest
      # process, so it does not get the test defaults and refuses to start
      # without a sender. That refusal is the point of the check.
      SYSTEM_EMAIL_FROM: no-reply@ci.invalid
      SYSTEM_EMAIL_FROM_NAME: ForgeMsg CI
      # localhost, not 127.0.0.1: the session cookie the API sets is host-only,
      # so a cookie issued by 127.0.0.1:3001 is never sent to localhost:3000 and
      # apps/web's middleware bounces every logged-in user back to /login.
      # Both origins must agree on the hostname.
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm seed
      - name: Build + start API in background
        run: |
          # `pnpm --filter <pkg> build` runs the package script directly and
          # bypasses turbo, so turbo.json `build.dependsOn: ["^build"]` never
          # applies and packages/shared/dist is never produced. That is why
          # this step failed with 144 TS2307 "Cannot find module
          # '@forgemsg/shared'" the first time the job ever ran.
          pnpm turbo build --filter=@forgemsg/api
          nohup pnpm --filter @forgemsg/api start > /tmp/api.log 2>&1 &
          sleep 5
          # --retry-connrefused is load-bearing, not decoration: plain --retry
          # only retries *transient* errors (timeouts, 5xx, 429). A refused
          # connection — exactly what a not-yet-listening API returns — is not
          # in that set, so without this flag curl bails on the first attempt
          # with exit 7 and the 10 retries never run at all.
          #
          # --retry 30 (not 10) buys headroom the old budget did not have.
          # Measured cold start of this same command
          # (`pnpm --filter @forgemsg/api start`, tsx dist/index.js):
          #   - dev box (Windows): 13.6 / 14.5 / 16.0 s over three runs
          #   - this runner (ubuntu-latest): under 5 s — the first curl after
          #     the sleep succeeded, so the retries were never entered
          # The runner is the faster of the two, so 5 + 10x2 = 25 s was not
          # what broke the step; the missing --retry-connrefused was. 30
          # retries (ceiling 5 + 30x2 = 65 s) cover a cold or loaded runner
          # at ~4x the slowest start we have measured anywhere, and cost
          # nothing when the API is already up — curl stops at first success.
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3001/health || {
            echo "::group::/tmp/api.log"; cat /tmp/api.log; echo "::endgroup::"; exit 1;
          }
      - name: Build + start web in background
        run: |
          pnpm turbo build --filter=@forgemsg/web
          nohup pnpm --filter @forgemsg/web start > /tmp/web.log 2>&1 &
          sleep 5
          # Same reasoning as the API step above: without --retry-connrefused
          # the retries are dead code for the one failure they exist to cover.
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3000/landing || {
            echo "::group::/tmp/web.log"; cat /tmp/web.log; echo "::endgroup::"; exit 1;
          }
      - name: Install Playwright browsers
        run: pnpm --filter @forgemsg/web exec playwright install --with-deps chromium
      - name: Run smoke
        run: pnpm --filter @forgemsg/web test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # ── DB migrations ──────────────────────────────────────────────────────────
  #
  # These two lived in db-migrations.yml, triggered by `on: pull_request:
  # paths:`. That put them out of reach of `ci-pass`, whose `needs` cannot name
  # a job in another workflow, and branch protection requires only `CI Pass` —
  # so a PR with a broken migration merged with a green merge button and
  # nothing said otherwise.
  #
  # Making them required where they were is not possible. GitHub's own
  # troubleshooting page is explicit: a workflow skipped by a paths filter
  # leaves its check "Pending" and blocks merging forever, so adding those two
  # names to required_status_checks would hang every PR that does not touch
  # migrations. (A job skipped by an `if:` reports Success instead — which is
  # the opposite failure: it satisfies the requirement without running.)
  #
  # So they move here and run unconditionally. No paths filter, no `if:`, and
  # `ci-pass` can keep treating `skipped` as a failure for every job it names.
  # The cost is measured, not guessed: 21-26 s for the drift check and 36-41 s
  # for the dry run, against a critical path of 3m49s (Integration). They are
  # not on it, so the pipeline does not get slower.

  drift-check:
    name: Schema ↔ migrations drift
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The drift check below can only see what the barrel exports, because
      # drizzle.config.ts names db/schema/index.ts as the schema entry. A table
      # whose module is missing from that file produces no diff and this job
      # passes — which is exactly how data_sets, permission_sets and
      # user_permission_sets went unmigrated while a live route queried them.
      # So verify the barrel first; otherwise "no drift" is only true of the
      # tables drizzle-kit happens to be able to see.
      - name: Every pgTable is re-exported from the schema barrel
        working-directory: apps/api
        run: pnpm exec vitest run src/db/schema-barrel.test.ts

      # drizzle-kit exits 0 even when it refuses to do any work. A snapshot
      # chain with two children of one parent makes it print
      #
      #   Error: [0018_snapshot.json, 0019_snapshot.json] are pointing to a
      #   parent snapshot: … which is a collision.
      #
      # and return success, having generated nothing. The next step then finds
      # drizzle/ unchanged and reports "no drift" — so a generate that cannot
      # run at all ships as a green check. That is not hypothetical: PR #88
      # would have done exactly this.
      #
      # There is no exit code to read here, and no artefact either, because the
      # failure mode IS "produced nothing". The printed message is the only
      # signal drizzle-kit gives, so the message is what this checks. Table
      # names are lower snake_case, so an anchored `^Error` cannot collide with
      # the tool's normal per-table output.
      - name: Generate migrations from current schema (dry)
        working-directory: apps/api
        run: |
          set -o pipefail
          pnpm db:generate 2>&1 | tee "$RUNNER_TEMP/generate.log"
          if grep -q '^Error' "$RUNNER_TEMP/generate.log"; then
            echo "::error::drizzle-kit did not complete — it printed an Error and exited 0. See the log above."
            exit 1
          fi

      - name: Verify no uncommitted SQL was produced
        working-directory: apps/api
        run: |
          # If `db:generate` writes a new SQL file or modifies the journal,
          # the schema is ahead of the committed migrations. Block the PR.
          if ! git diff --quiet --exit-code drizzle/; then
            echo "::error::drizzle/ has uncommitted changes — schema and migrations are out of sync."
            echo "Run \`pnpm db:generate\` locally and commit the result."
            git status drizzle/
            git diff drizzle/
            exit 1
          fi

  apply-dry-run:
    name: Apply migrations (dry run)
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_test
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations against ephemeral Postgres
        working-directory: apps/api
        run: pnpm db:migrate

      - name: Verify schema query reachability
        run: |
          # A trivial query against information_schema confirms migrations took.
          PGPASSWORD=forgemsg psql -h localhost -U forgemsg -d forgemsg_test \
            -c "select count(*) from information_schema.tables where table_schema='public';"

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    # Every job that can fail on the code: both integration suites, and both
    # DB-migration checks.
    #
    # They were left out with a note saying one new test should not gate the
    # pipeline "until it has a track record". They have one now — 9 files
    # between them — and leaving them out had a cost: a red integration suite
    # still produced a green CI Pass, so a PR could merge with it broken and
    # nothing on the PR page said otherwise. That is how the missing
    # INTERNAL_API_SECRET above reached master in the first place.
    #
    # `audit` and `e2e` stay out on purpose, see the step below.
    needs:
      [
        lint,
        typecheck,
        test,
        build,
        build-go,
        integration,
        workers-integration,
        drift-check,
        apply-dry-run,
      ]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          # `skipped` counts as a failure for these: a required job that did not
          # run is a required job that did not pass. e2e is label-gated and
          # audit is continue-on-error, so neither is required here.
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          BUILD_GO: ${{ needs['build-go'].result }}
          INTEGRATION: ${{ needs.integration.result }}
          WORKERS_INTEGRATION: ${{ needs['workers-integration'].result }}
          DRIFT_CHECK: ${{ needs['drift-check'].result }}
          APPLY_DRY_RUN: ${{ needs['apply-dry-run'].result }}
        run: |
          failed=''
          for job in LINT TYPECHECK TEST BUILD BUILD_GO INTEGRATION WORKERS_INTEGRATION DRIFT_CHECK APPLY_DRY_RUN; do
            eval "result=\$$job"
            echo "$job: $result"
            [ "$result" = 'success' ] || failed="$failed $job"
          done
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed:$failed"
            exit 1
          fi
