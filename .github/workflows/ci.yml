name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forgemsg_test
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # Non-blocking — surfaces new high+critical CVEs as a warning so we
    # can patch quickly without blocking unrelated PRs. Promote to a
    # required check once we've stabilised the baseline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  build-go:
    name: Build Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [engine, sms-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/${{ matrix.service }}/go.sum
      - name: Build ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go build -o /dev/null .
      - name: Vet ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go vet ./...

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck]
    # Skip by default — the dev stack is heavyweight and the suite is
    # opt-in. Trigger by labeling a PR with `run-e2e` or running the
    # workflow manually. When we have a staging deploy we can run it
    # post-merge against staging instead.
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e') || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_e2e
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-only-secret-not-for-production-use-1234567890
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm seed
      - name: Build + start API in background
        run: |
          pnpm --filter @forgemsg/api build
          nohup pnpm --filter @forgemsg/api start > /tmp/api.log 2>&1 &
          sleep 5
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:3001/health
      - name: Build + start web in background
        run: |
          pnpm --filter @forgemsg/web build
          nohup pnpm --filter @forgemsg/web start > /tmp/web.log 2>&1 &
          sleep 5
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/landing
      - name: Install Playwright browsers
        run: pnpm --filter @forgemsg/web exec playwright install --with-deps chromium
      - name: Run smoke
        run: pnpm --filter @forgemsg/web test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, build-go]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] \
            || [ "${{ needs.typecheck.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.build-go.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
