name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both checks run even if the earlier one fails, so a single CI run
      # reports the full set of violations instead of stopping at the first.
      - run: pnpm format:check
        if: always()
      - run: pnpm lint
        if: always()

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        # pgvector, not plain postgres:16-alpine — the baseline migration opens
        # with `CREATE EXTENSION IF NOT EXISTS vector;` and alpine answers
        # `ERROR: extension "vector" is not available` (the control file is not
        # on the image at all, so IF NOT EXISTS does not save it).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_test
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite currently passes with no database at all (postgres-js connects
      # lazily and nothing queries), so this does not change any result today.
      # It exists so the Postgres service is actually schema-backed and the
      # first test that does hit the DB gets a real one instead of an empty one.
      - name: Apply migrations
        run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm test

  integration:
    name: Integration (real DB)
    runs-on: ubuntu-latest
    needs: [typecheck]
    # Deliberately NOT in the CI Pass needs list yet — this is one test, and a
    # single new check should not be able to gate the whole pipeline until it
    # has a track record.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_itest
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # 127.0.0.1, not localhost: postgres-js in the app's connection pool
      # resolves `localhost` to ::1 on some hosts and then times out against a
      # service published on IPv4. Reproduced locally as
      # `write CONNECT_TIMEOUT localhost:55433`.
      DATABASE_URL: postgresql://forgemsg:forgemsg@127.0.0.1:5432/forgemsg_itest
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: integration-only-secret-not-for-production-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm seed
      - run: pnpm --filter @forgemsg/api test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # Non-blocking — surfaces new high+critical CVEs as a warning so we
    # can patch quickly without blocking unrelated PRs. Promote to a
    # required check once we've stabilised the baseline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  build-go:
    name: Build Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [engine, sms-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/${{ matrix.service }}/go.sum
      - name: Build ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go build -o /dev/null .
      - name: Vet ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: go vet ./...

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck]
    # Skip by default — the dev stack is heavyweight and the suite is
    # opt-in. Trigger by labeling a PR with `run-e2e` or running the
    # workflow manually. When we have a staging deploy we can run it
    # post-merge against staging instead.
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e') || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgemsg_e2e
          POSTGRES_USER: forgemsg
          POSTGRES_PASSWORD: forgemsg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgemsg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forgemsg:forgemsg@localhost:5432/forgemsg_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-only-secret-not-for-production-use-1234567890
      # localhost, not 127.0.0.1: the session cookie the API sets is host-only,
      # so a cookie issued by 127.0.0.1:3001 is never sent to localhost:3000 and
      # apps/web's middleware bounces every logged-in user back to /login.
      # Both origins must agree on the hostname.
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgemsg/api db:migrate
      - run: pnpm seed
      - name: Build + start API in background
        run: |
          # `pnpm --filter <pkg> build` runs the package script directly and
          # bypasses turbo, so turbo.json `build.dependsOn: ["^build"]` never
          # applies and packages/shared/dist is never produced. That is why
          # this step failed with 144 TS2307 "Cannot find module
          # '@forgemsg/shared'" the first time the job ever ran.
          pnpm turbo build --filter=@forgemsg/api
          nohup pnpm --filter @forgemsg/api start > /tmp/api.log 2>&1 &
          sleep 5
          curl --fail --retry 10 --retry-delay 2 http://localhost:3001/health || {
            echo "::group::/tmp/api.log"; cat /tmp/api.log; echo "::endgroup::"; exit 1;
          }
      - name: Build + start web in background
        run: |
          pnpm turbo build --filter=@forgemsg/web
          nohup pnpm --filter @forgemsg/web start > /tmp/web.log 2>&1 &
          sleep 5
          curl --fail --retry 10 --retry-delay 2 http://localhost:3000/landing || {
            echo "::group::/tmp/web.log"; cat /tmp/web.log; echo "::endgroup::"; exit 1;
          }
      - name: Install Playwright browsers
        run: pnpm --filter @forgemsg/web exec playwright install --with-deps chromium
      - name: Run smoke
        run: pnpm --filter @forgemsg/web test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, build-go]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] \
            || [ "${{ needs.typecheck.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.build-go.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
