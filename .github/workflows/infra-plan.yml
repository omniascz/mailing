name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-plan.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, production]
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          aws-region: eu-central-1

      - run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - run: terraform init -backend-config=backend.tfvars

      - run: terraform validate

      - id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Comment plan output
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const out = `### Terraform plan — ${{ matrix.env }}\n\nExit: ${{ steps.plan.outcome }}\n\n_See workflow logs for full output._`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: out,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
