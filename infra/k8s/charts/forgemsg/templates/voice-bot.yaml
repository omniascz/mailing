{{- if .Values.voiceBot.enabled -}}
{{- $component := "voice-bot" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forgemsg.serviceAccountName" (dict "Release" .Release "component" $component) }}
  labels:
    {{- include "forgemsg.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ $component }}
  labels:
    {{- include "forgemsg.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ .Values.voiceBot.replicaCount }}
  selector:
    matchLabels:
      {{- include "forgemsg.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "forgemsg.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" $component) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "forgemsg.serviceAccountName" (dict "Release" .Release "component" $component) }}
      containers:
        - name: voice-bot
          image: {{ include "forgemsg.image" (dict "Values" .Values "imageName" .Values.voiceBot.image.name) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: ws
              containerPort: {{ .Values.voiceBot.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-env
            - secretRef:
                name: {{ .Values.global.externalSecretName }}
          env:
            - name: VOICE_BOT_PORT
              value: {{ .Values.voiceBot.port | quote }}
          resources:
            {{- toYaml .Values.voiceBot.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ $component }}
  labels:
    {{- include "forgemsg.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - name: ws
      port: 80
      targetPort: ws
  selector:
    {{- include "forgemsg.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" $component) | nindent 4 }}
{{- if .Values.voiceBot.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-{{ $component }}
  labels:
    {{- include "forgemsg.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.voiceBot.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.voiceBot.ingress.className }}
  rules:
    - host: {{ .Values.voiceBot.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-{{ $component }}
                port:
                  number: 80
{{- end }}
{{- end }}
