global:
  environment: production
  domain: example.invalid
  image:
    repositoryPrefix: forgemsg-org/forgemsg

api:
  replicaCount: 3
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 2,    memory: 2Gi }
  autoscaling:
    minReplicas: 3
    maxReplicas: 20
  ingress:
    host: api.example.invalid

workers:
  replicaCount: 3
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 4,    memory: 4Gi }
  autoscaling:
    minReplicas: 3
    maxReplicas: 30

voiceBot:
  replicaCount: 2
  ingress:
    host: voice.example.invalid

engine:
  replicaCount: 3
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: 4,    memory: 2Gi }

smsGateway:
  replicaCount: 2
