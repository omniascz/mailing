# Default values for the ForgeMsg umbrella chart.
# Override per environment via values-staging.yaml / values-production.yaml.

global:
  image:
    registry: ghcr.io
    repositoryPrefix: forgemsg-org/forgemsg
    pullPolicy: IfNotPresent
    tag: '' # Set per deploy from CI. Falls back to .Chart.AppVersion.
    pullSecrets: [] # e.g. [ghcr-pull]
  environment: staging
  domain: staging.forgemsg.com

  # Reference an externally-managed Secret (created by ops or external-secrets).
  #
  # Required keys (both api and workers envFrom this secret, so they see the
  # same values):
  #   DATABASE_URL
  #   REDIS_URL
  #   JWT_SECRET
  #   SESSION_SECRET       — signs session cookies. Required in production;
  #     without it the API used to boot on the dev default committed in
  #     apps/api/src/config/env.ts, which lets anyone forge a session.
  #   MINIO_ACCESS_KEY / MINIO_SECRET_KEY — object storage. Same story: the
  #     committed default was minioadmin/minioadmin.
  #   MINIO_ENDPOINT       — where the store is. Not a secret, but listed here
  #     because it belongs with the two above: the API refuses to boot in
  #     production without it. Its development default is `localhost`, which in
  #     a pod is the API container, so an unset value used to send every upload
  #     to this process instead of the store. Set it alongside MINIO_PORT,
  #     MINIO_USE_SSL and the bucket names in `env` below.
  #   INTERNAL_API_SECRET  — shared secret for /api/v1/internal/*. The API
  #     refuses to boot in production without it, and rejects internal requests
  #     that do not carry it as x-internal-secret. It must be present because
  #     api.ingress publishes `path: /` on an internet-facing ALB, so those
  #     routes are reachable from outside the cluster. The engine's submission
  #     server reads THIS SAME var (not a SUBMISSION_API_SECRET alias) and fails
  #     to boot without it — one value, one name, given to both Deployments.
  #   INBOUND_EMAIL_SECRET — validates X-Inbound-Secret on the inbound-email
  #     endpoint. prodRequired on the API; the engine's inbound receiver reads
  #     the same var (not an INBOUND_API_SECRET alias) and fails to boot without
  #     it. Same value, same name, given to both the API and engine Deployments.
  #   TRACKING_SECRET      — HMAC key over every token handed to a recipient:
  #     the open pixel, wrapped links, the unsubscribe link in List-Unsubscribe,
  #     the preference centre, view-in-browser. The api and workers Deployments
  #     both take it from this secret and must receive the SAME value — workers
  #     sign the tokens, the API verifies them. Its dev fallback is a constant
  #     in packages/shared, so without this anyone who reads the repository can
  #     forge an open, a click, or somebody else's unsubscribe.
  externalSecretName: forgemsg-app

  # IRSA — bind ServiceAccounts to AWS IAM roles for S3 / SES.
  serviceAccount:
    annotationsRolePrefix: '' # e.g. arn:aws:iam::123:role/forgemsg-

# ─── api ─────────────────────────────────────────────────────────────────────

api:
  enabled: true
  replicaCount: 2
  image:
    name: api
  port: 3001
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  ingress:
    enabled: true
    className: alb
    host: api.staging.forgemsg.com
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'

# ─── workers ─────────────────────────────────────────────────────────────────

workers:
  enabled: true
  replicaCount: 2
  image:
    name: workers
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 2, memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    # Workers scale on Redis queue depth in prod (KEDA — out of scope here),
    # CPU is a coarse proxy for the chart skeleton.
    targetCPUUtilizationPercentage: 75

# ─── voice-bot ───────────────────────────────────────────────────────────────

voiceBot:
  enabled: true
  replicaCount: 1
  image:
    name: voice-bot
  port: 8787
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }
  ingress:
    enabled: true
    className: alb
    host: voice.staging.forgemsg.com
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'

# ─── engine (Go MTA) ─────────────────────────────────────────────────────────

engine:
  enabled: true
  replicaCount: 2
  image:
    name: engine
  port: 50051 # gRPC
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 2, memory: 1Gi }
  # No ingress — internal only (workers dial it via service DNS).

# ─── sms-gateway ─────────────────────────────────────────────────────────────

smsGateway:
  enabled: true
  replicaCount: 1
  image:
    name: sms-gateway
  port: 2775 # SMPP
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1, memory: 512Mi }
  service:
    type: ClusterIP
    # SMPP egress is initiated by the gateway, no external Service required.

# ─── shared env ──────────────────────────────────────────────────────────────

env:
  # Plain values — non-secret. Secrets come from externalSecretName.
  NODE_ENV: production
  LOG_LEVEL: info
  CLICKHOUSE_URL: http://clickhouse.forgemsg.svc.cluster.local:8123
  KAFKA_BROKERS: kafka.forgemsg.svc.cluster.local:9092
  ENGINE_GRPC_URL: forgemsg-engine.forgemsg.svc.cluster.local:50051

  # ─── IP warmup ─────────────────────────────────────────────────────────────
  # Local addresses the MTA may bind to when dialling out, comma-separated
  # (apps/engine/internal/config/config.go: envStringSlice). Empty means a
  # shared pool: no ramp is applied and the engine logs that at boot.
  #
  # Setting SENDING_IPS without WARMUP_API_URL makes the engine refuse to boot,
  # because an unenforced warmup on a cold dedicated IP is the reputation
  # damage warmup exists to prevent.
  SENDING_IPS: ''
  WARMUP_API_URL: http://forgemsg-api.forgemsg.svc.cluster.local:3001

  # ─── Object storage ────────────────────────────────────────────────────────
  # Media library, video messages, downloadable assets and the email-event
  # archive all write here through apps/api/src/lib/object-store.ts.
  #
  # MINIO_ENDPOINT is the one that has to be set: its default is `localhost`,
  # which in a pod is the API container, so an unset value used to point every
  # upload at this process. The API refuses to boot in production without it.
  # The credentials come from externalSecretName, not from here.
  MINIO_ENDPOINT: minio.forgemsg.svc.cluster.local
  MINIO_PORT: '9000'
  MINIO_USE_SSL: 'false'
  AWS_REGION: us-east-1
  MINIO_BUCKET: forgemsg
  MINIO_VIDEO_BUCKET: forgemsg-video
  ASSET_STORAGE_BUCKET: forgemsg-assets
